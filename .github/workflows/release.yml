name: Release

env:
  DEBUG: napi:*
  APP_NAME: doc-extract
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Runs only for v* tags. workflow_dispatch skips this step and still succeeds,
      # so manual builds are not blocked. A mismatch fails the workflow before the
      # prebuild matrix starts.
      - name: Fail unless the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=${tag} package.json=${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::Tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bunx napi build --platform --release --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bunx napi build --platform --release --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bunx napi build --platform --release --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: i686-pc-windows-msvc
            build: bunx napi build --platform --release --target i686-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bunx napi build --platform --release --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bunx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: bunx napi build --platform --release --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: bunx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: bunx napi build --platform --release --target aarch64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: bunx napi build --platform --release --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            build: bunx napi build --platform --release --target wasm32-wasip1-threads
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: release-${{ matrix.settings.target }}-${{ matrix.settings.host }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: mlugg/setup-zig@v2
        if: contains(matrix.settings.target, 'musl')
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: contains(matrix.settings.target, 'musl')
        with:
          tool: cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: ${{ matrix.settings.build }}

      - name: Upload artifact (native)
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - name: Upload artifact (WASI)
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-wasm32-wasip1-threads
          path: |
            ${{ env.APP_NAME }}.*.wasm
            ${{ env.APP_NAME }}.wasi.cjs
            ${{ env.APP_NAME }}.wasi-browser.js
            wasi-worker.mjs
            wasi-worker-browser.mjs
          if-no-files-found: error

  build-freebsd:
    needs: check-version
    runs-on: ubuntu-latest
    name: build x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v6

      - uses: cross-platform-actions/action@v1.1.0
        env:
          DEBUG: napi:*
        with:
          operating_system: freebsd
          version: '14.2'
          run: |
            sudo pkg install -y curl node npm rust
            npm install
            npx napi build --platform --release --target x86_64-unknown-freebsd

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-x86_64-unknown-freebsd
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-native:
    name: test ${{ matrix.settings.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .

      - run: bun test

  test-wasi:
    name: test wasm32-wasip1-threads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: .

      - run: node scripts/test-wasi.cjs

  # Publishes only when a version tag (v*) is pushed. workflow_dispatch builds
  # artifacts but does not publish.
  #
  # Auth is npm Trusted Publishing (OIDC), not an npm token. Do not set
  # NPM_TOKEN or NODE_AUTH_TOKEN. On npmjs.com, each package below needs a
  # GitHub Actions trusted publisher:
  #   repository alexstep/doc-extract, workflow filename release.yml,
  #   environment name left blank, and direct `npm publish` allowed
  #   (configs created after 2026-09-03 default to stage-only).
  # `npm publish` runs prepublishOnly, which runs `napi prepublish`. That
  # command shells out to `npm publish` (npmClient defaults to npm) in each
  # npm/<platform> directory with the inherited environment, including the
  # Actions OIDC request variables. npm >= 11.5.1 uses that OIDC identity
  # before any token. This job never sets NPM_TOKEN or NODE_AUTH_TOKEN.
  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build
      - build-freebsd
      - test-native
      - test-wasi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Fail unless the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=${tag} package.json=${pkg}"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::Tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          npm install -g npm@11
          version="$(npm --version)"
          echo "npm ${version}"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) {
              console.error("npm " + process.argv[1] + " is older than 11.5.1")
              process.exit(1)
            }
          ' "${version}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bunx napi create-npm-dirs

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - run: bunx napi artifacts --build-output-dir artifacts/bindings-wasm32-wasip1-threads

      - name: List npm packages
        run: ls -R ./npm

      - name: Verify scoped loader
        run: grep -q '@alexstep/doc-extract-' index.js

      - name: Verify platform package versions
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          mismatch=0
          for manifest in npm/*/package.json; do
            found="$(node -p "require('./${manifest}').version")"
            echo "${manifest} ${found}"
            if [ "${found}" != "${pkg}" ]; then
              echo "::error::${manifest} is ${found}, expected ${pkg}"
              mismatch=1
            fi
          done
          exit "${mismatch}"

      - name: Publish
        run: npm publish --access public
