[package]
name = "doc-extract"
version = "0.2.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
calamine = "0.37"
csv = "1.3"
encoding_rs = "0.8"
html2text = "0.17"
ical = "0.11"
napi = { version = "3", default-features = false, features = ["napi6", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync"] }
pdf-extract = "0.12"
quick-xml = "0.42"
regex = "1.11"
serde_json = "1.0"
thiserror = "1.0"
memmap2 = "0.9.11"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[build-dependencies]
napi-build = "2"
